<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a; }
      .card { text-align: center; padding: 2rem; }
      h1 { font-size: 1.25rem; margin-bottom: .5rem; }
      p { color: #64748b; font-size: .875rem; }
      a { display: inline-block; margin-top: 1rem; padding: .6rem 1.2rem; background: #3b82f6; color: #fff; border-radius: .5rem; text-decoration: none; font-size: .875rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page isn't cached yet. Sales and stock ops queued on this device will sync when you're back online.</p>
      <a href="/pos">Open POS</a>
    </div>
  </body>
</html>
